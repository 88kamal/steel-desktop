<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Steel Workflow – Offline</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #f8fafc; color: #0f172a;
    }
    @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } p { color: #94a3b8 !important; } }
    .card { text-align: center; max-width: 380px; padding: 24px; }
    .logo {
      width: 64px; height: 64px; margin: 0 auto 16px; display: block;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #475569; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #1d4ed8; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1e40af; }
    small { display: block; margin-top: 14px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="" />
    <h1>Can't reach Steel Workflow</h1>
    <p>Check your internet connection. The app will reconnect automatically.</p>
    <button id="retry">Try again</button>
    <small id="status">Retrying in <span id="secs">10</span>s…</small>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get('url');
    const go = () => { if (target) location.href = target; };
    document.getElementById('retry').addEventListener('click', go);
    let s = 10;
    const el = document.getElementById('secs');
    setInterval(() => { s -= 1; if (s <= 0) { go(); s = 10; } el.textContent = s; }, 1000);
    window.addEventListener('online', go);
  </script>
</body>
</html>
